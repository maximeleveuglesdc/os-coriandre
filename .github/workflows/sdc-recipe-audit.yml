name: Audit recipe disclosure surfaces
on:
  push:
    branches: ['sdc/recipe-demo-redaction-20260922']
    paths: ['.github/workflows/sdc-recipe-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inspect structures without printing recipe contents
        shell: python
        run: |
          import re, json
          from pathlib import Path
          s=Path('index.html').read_text()
          line=lambda p:s.count('\n',0,p)+1
          for m in re.finditer(r'(?:const|var|let)\s+(\w+)\s*=\s*([\[{])',s):
              name=m[1]
              if name.isupper() or name in ['PLATS','RECETTES','A09','MEP']:
                  print('DATA', name,'line',line(m.start()))
                  try:
                      obj,_=json.JSONDecoder().raw_decode(s[m.end()-1:])
                      if isinstance(obj,list):
                          shapes={}
                          for row in obj:
                              if isinstance(row,dict):
                                  for k,v in row.items():
                                      shapes[k]=type(v).__name__
                                      if isinstance(v,list) and v and isinstance(v[0],dict): shapes[k]=list(v[0])
                          print('SHAPE',name,len(obj),json.dumps(shapes))
                  except Exception: pass
          for m in re.finditer(r'function\s+([\w$]+)\s*\(',s):
              name=m[1]
              if re.search('recette|plat|print|export|pdf|ia|a09|mep|food|search|portion',name,re.I):
                  print('FUNCTION',name,'line',line(m.start()))
          for m in re.finditer(r'<div class="section[^\"]*" id="([^"]+)"',s):
              print('SECTION',m[1],'line',line(m.start()))
          for m in re.finditer(r'(?:data:application/pdf|data:application/zip|\.pdf[\"\x27]|\.xlsx[\"\x27]|\.docx[\"\x27]|atob\(|fetch\()',s):
              print('SURFACE',m.group(),'line',line(m.start()))
