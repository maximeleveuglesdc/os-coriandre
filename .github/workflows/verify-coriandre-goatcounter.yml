name: Verify live Coriandre GoatCounter
on:
  push:
    branches: ['sdc/goatcounter-coriandre-20260922']
    paths: ['.github/workflows/verify-coriandre-goatcounter.yml']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install browser verification tools
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Verify actual public site and one labelled test visit
        shell: python
        run: |
          import json, hashlib
          from urllib.parse import urlsplit, parse_qs
          from playwright.sync_api import sync_playwright
          endpoint = 'https://os-coriandre.goatcounter.com/count'
          source_url = 'https://coriandre.structuredecuisine.ca/?sdc_build=goatcounter_final_20260922'
          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              page = browser.new_page()
              source = page.request.get(source_url)
              assert source.ok, source.status
              raw = source.body()
              assert raw.count(b'data-goatcounter=') == 1
              assert b'id="sdc-goatcounter-events"' in raw
              blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              print('LIVE_HTML', json.dumps({'http':source.status,'blob':blob,'tracker_count':1}), flush=True)
              responses = []
              def on_response(response):
                  if response.url.startswith(endpoint + '?'):
                      responses.append({'http':response.status,'query':parse_qs(urlsplit(response.url).query)})
              page.on('response', on_response)
              page.route('**/*', lambda r: r.abort() if r.request.resource_type in ['image','font','media'] and not r.request.url.startswith(endpoint + '?') else r.continue_())
              page.goto('https://coriandre.structuredecuisine.ca/?utm_campaign=controle_installation&utm_source=test_technique', wait_until='domcontentloaded')
              page.wait_for_function('!!(window.goatcounter && window.goatcounter.count && window.sdcFlushAnalytics)')
              page.wait_for_timeout(2500)
              state = page.evaluate('''() => ({
                endpoint:document.getElementById('sdc-goatcounter').getAttribute('data-goatcounter'),
                integrated:!!window.__sdcCoriandreAnalytics,
                filtered:window.goatcounter.filter(),
                computedTestUrl:window.goatcounter.url({path:'controle-technique-verification',title:'Controle SDC',event:true})
              })''')
              assert state['endpoint'] == endpoint
              assert state['integrated'] is True
              assert state['computedTestUrl'].startswith(endpoint + '?')
              assert any(response['http'] == 200 for response in responses), responses
              print('LIVE_VERIFICATION_OK', json.dumps({'endpoint':state['endpoint'],'integrated':state['integrated'],'filtered':state['filtered'],'count_responses':responses}), flush=True)
              browser.close()
