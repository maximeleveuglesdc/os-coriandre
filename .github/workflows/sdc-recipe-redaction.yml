name: Build and verify public recipe redaction
on:
  push:
    branches: ['sdc/recipe-demo-redaction-20260922']
    paths: ['.github/workflows/sdc-recipe-redaction.yml', '.github/sdc_redact_recipes.py', '.github/sdc_test_redaction.py']
permissions:
  contents: write
concurrency:
  group: sdc-recipe-redaction
  cancel-in-progress: false
jobs:
  redact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: sdc/recipe-demo-redaction-20260922
      - name: Include duplicated recipe details in source redaction
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/sdc_redact_recipes.py')
          s=p.read_text()
          extra='''
          # Redact duplicated technical prose outside the general MAPAQ module.
          ma=s.index('<div class="section" id="sec-cuisinier-mapaq">')
          mb=s.index('<div class="section"',ma+30)
          left,safety,right=s[:ma],s[ma:mb],s[mb:]
          for text in removed:
              if len(text)<55:continue
              variants={text,json.dumps(text,ensure_ascii=True)[1:-1],json.dumps(text,ensure_ascii=False)[1:-1]}
              for v in variants:
                  left=left.replace(v,D)
                  right=right.replace(v,D)
          s=left+safety+right
          '''
          s=s.replace('# Existing tracking and financial/catalogue data must remain byte-for-byte identical.',extra+'\n# Existing tracking and financial/catalogue data must remain byte-for-byte identical.')
          p.write_text(s)
      - name: Mask only public recipe source and linked disclosures
        run: python .github/sdc_redact_recipes.py
      - name: Verify inline JavaScript syntax
        run: |
          node <<'JS'
          const fs=require('fs'), vm=require('vm'), html=fs.readFileSync('index.html','utf8');
          let n=0;
          for(const m of html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)){
            if(/application\/ld\+json/i.test(m[1]))continue;
            new vm.Script(m[2]); n++;
          }
          console.log('Inline scripts valid:',n);
          JS
      - name: Install browser checks
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Verify recipes assembly search assistant tracking and untouched finances
        run: python .github/sdc_test_redaction.py
      - name: Commit only tested public index
        run: |
          git config user.name 'SDC integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'feat: mask recipe quantities and methods across public demo without redesign'
          git push origin HEAD:refs/heads/sdc/recipe-demo-redaction-20260922
