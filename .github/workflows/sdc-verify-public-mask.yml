name: Verify live public recipe masking
on:
  push:
    branches: ['sdc/recipe-demo-redaction-20260922']
    paths: ['.github/workflows/sdc-verify-public-mask.yml']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install browser verification
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Verify actual public recipe redaction
        shell: python
        run: |
          import time,json,hashlib
          from urllib.request import urlopen,Request
          from playwright.sync_api import sync_playwright
          url='https://coriandre.structuredecuisine.ca/?sdc_build=recipe_mask_20260922'
          expected='0b70cabaa0f9e06b8b01ce56d72dadb3d0e44fbf'
          for attempt in range(24):
              with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=20) as r:
                  data=r.read()
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if blob==expected:break
              time.sleep(5)
          else:raise SystemExit('Expected public redaction build not yet served')
          with sync_playwright() as pw:
              b=pw.chromium.launch()
              p=b.new_page(viewport={'width':1440,'height':1000})
              def route(r):
                  if r.request.url=='https://gc.zgo.at/count.js':
                      r.fulfill(body='window.goatcounter.count=function(){};',content_type='application/javascript')
                  elif r.request.resource_type in ['font','image','media']:r.abort()
                  else:r.continue_()
              p.route('**/*',route)
              p.goto(url,wait_until='load')
              p.evaluate("selectRole('cuisinier');showSection('sec-cuisinier-recettes');openRecette('R01')")
              p.wait_for_function("document.querySelectorAll('#modal-recette-body .sdc-recipe-mask').length>0")
              protected=p.evaluate("RECETTES.every(r=>r.etapes.every(e=>e==='[SDC:ETAPE]')&&r.ingredients.every(i=>!i.q||i.q==='[SDC:QTE]'))")
              assert protected
              count=p.locator('#modal-recette-body .sdc-recipe-mask').count()
              assert count>4
              tracker=p.locator('#sdc-goatcounter').get_attribute('data-goatcounter')
              assert tracker=='https://os-coriandre.goatcounter.com/count'
              p.evaluate("closeModal('modal-recette');selectRole('admin');showSection('sec-admin-cockpit')")
              assert p.locator('#sec-admin-cockpit').is_visible()
              p.set_viewport_size({'width':390,'height':844})
              p.evaluate("selectRole('cuisinier');openPlat('A01')")
              p.wait_for_function("document.querySelectorAll('#modal-plat-body .sdc-recipe-mask').length>0")
              print('LIVE_MASK_VERIFIED',json.dumps({'public_blob':blob,'recipe_source_protected':protected,'recipe_masks':count,'assembly_mobile_masks':p.locator('#modal-plat-body .sdc-recipe-mask').count(),'cockpit_usable':True,'goatcounter_preserved':True,'analytics_test_visits_sent':0}))
              b.close()
