name: Install and verify Coriandre GoatCounter
on:
  push:
    branches: ['sdc/goatcounter-coriandre-20260922']
    paths: ['.github/workflows/install-coriandre-goatcounter.yml']
permissions:
  contents: write
jobs:
  install:
    if: github.repository == 'maximeleveuglesdc/os-coriandre'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: sdc/goatcounter-coriandre-20260922
      - name: Add tracker without changing existing application bytes
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          p = Path('index.html')
          original = p.read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest()
          if sha != 'd3a86474a029b51c32b3cb6bc1d1d5553cc38d82':
              raise SystemExit('Source changed; stop rather than overwrite another edit: ' + sha)
          assert original.count(b'</body>') == 1
          assert b'data-goatcounter=' not in original
          block = r'''
          <!-- SDC GoatCounter — Coriandre only — 2026-09-22 -->
          <script id="sdc-goatcounter-events">
          (function () {
            'use strict';
            if (window.__sdcCoriandreAnalytics) return;
            window.__sdcCoriandreAnalytics = true;
            var gc = window.goatcounter = window.goatcounter || {};
            // Keep only campaign tags; never send fbclid, email, searches or form data.
            gc.path = function () {
              var input = new URLSearchParams(location.search), output = new URLSearchParams();
              ['utm_campaign', 'utm_source'].forEach(function (key) {
                var value = input.get(key);
                if (value && /^[a-z0-9_-]{1,80}$/i.test(value)) output.set(key, value);
              });
              return location.pathname + (output.toString() ? '?' + output.toString() : '');
            };
            gc.referrer = function () {
              try { return document.referrer ? new URL(document.referrer).origin : ''; }
              catch (_) { return ''; }
            };
            var pending = [], seen = Object.create(null);
            function flush() {
              if (!window.goatcounter || typeof window.goatcounter.count !== 'function') return;
              pending.splice(0).forEach(function (item) {
                try { window.goatcounter.count(item); } catch (_) { /* Analytics must never stop the demo. */ }
              });
            }
            window.sdcFlushAnalytics = flush;
            function record(path, title) {
              if (seen[path]) return;
              seen[path] = true;
              if (pending.length < 50) pending.push({path: path, title: title, event: true});
              flush();
            }
            var labels = {
              accueil: 'Accueil', cockpit: 'Cockpit', dashboard: 'Tableau de bord',
              foodcost: 'Food cost', achats: 'Achats', menu: 'Menu', equipe: 'Equipe',
              commande: 'Commandes', contact: 'Contacts', horaires: 'Horaires',
              taches: 'Taches', production: 'Production', recettes: 'Recettes',
              assemblage: 'Assemblage', mep: 'Mise en place', mapaq: 'MAPAQ'
            };
            function navigation() {
              var active = document.querySelector('.section.active');
              if (!active || (!document.body.classList.contains('role-admin') &&
                              !document.body.classList.contains('role-cuisinier'))) return;
              var match = /^sec-(admin|cuisinier)-([a-z]+)$/.exec(active.id);
              if (!match || !Object.prototype.hasOwnProperty.call(labels, match[2])) return;
              var role = match[1] === 'admin' ? 'gestionnaire' : 'cuisinier';
              record('profil-' + role, 'Espace ' + role);
              record('section-' + role + '-' + match[2], role + ' - ' + labels[match[2]]);
            }
            function start() {
              if (typeof MutationObserver !== 'undefined') {
                var observer = new MutationObserver(navigation);
                document.querySelectorAll('.section').forEach(function (section) {
                  observer.observe(section, {attributes: true, attributeFilter: ['class']});
                });
              }
              document.addEventListener('click', function (event) {
                var target = event.target;
                var link = target && target.closest ? target.closest('a[href]') : null;
                if (!link) return;
                var href = (link.getAttribute('href') || '').trim();
                if (/^tel:/i.test(href)) {
                  var digits = href.slice(4).replace(/\D/g, '');
                  if (digits === '8192667473' || digits === '18192667473')
                    record('contact-sdc-telephone', 'Clic sur le telephone SDC');
                } else if (/^mailto:info@structuredecuisine\.ca(?:\?|$)/i.test(href)) {
                  record('contact-sdc-courriel', 'Clic sur le courriel SDC');
                }
              }, true);
              navigation();
              flush();
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once: true});
            else start();
          })();
          </script>
          <script id="sdc-goatcounter" data-goatcounter="https://os-coriandre.goatcounter.com/count"
                  async src="https://gc.zgo.at/count.js" onload="window.sdcFlushAnalytics()"></script>
          <!-- /SDC GoatCounter -->
          '''.encode('utf-8')
          patched = original.replace(b'</body>', block + b'</body>')
          assert patched.replace(block, b'', 1) == original
          p.write_bytes(patched)
          print('Original application bytes preserved. Added one Coriandre tracker.')
      - name: Check all inline JavaScript
        run: |
          node <<'JS'
          const fs = require('fs'), vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          let n = 0;
          for (const match of html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)) {
            if (/application\/ld\+json/i.test(match[1])) continue;
            new vm.Script(match[2]); n++;
          }
          if ((html.match(/data-goatcounter=/g) || []).length !== 1) throw new Error('Duplicate tracker');
          console.log('JavaScript syntax OK:', n, 'blocks; exactly one tracker');
          JS
      - name: Install browser test tools
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Verify navigation events and one labelled technical request
        shell: python
        run: |
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          html = Path('index.html').read_text()
          endpoint = 'https://os-coriandre.goatcounter.com/count'
          stub = '''window.__gcHits=[]; window.goatcounter.count=function(v){window.__gcHits.push(v)}; window.goatcounter.count({path:window.goatcounter.path(),event:false});'''
          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              page = browser.new_page()
              page.on('pageerror', lambda error: print('PAGE_ERROR', str(error)))
              def route(r):
                  if r.request.resource_type == 'document':
                      r.fulfill(body=html, content_type='text/html')
                  elif r.request.url == 'https://gc.zgo.at/count.js':
                      r.fulfill(body=stub, content_type='application/javascript')
                  else:
                      r.abort()
              page.route('**/*', route)
              page.goto('https://coriandre.structuredecuisine.ca/?utm_campaign=coriandre_avis&utm_source=facebook_groupes&email=must-not-leak&fbclid=must-not-leak')
              page.wait_for_function('!!(window.__gcHits && window.sdcFlushAnalytics)')
              for js in ["selectRole('admin')", "showSection('sec-admin-foodcost')", "selectRole('cuisinier')", "showSection('sec-cuisinier-mapaq')"]:
                  page.evaluate(js)
                  page.wait_for_timeout(250)
              page.evaluate('''() => {
                ['tel:+18192667473','mailto:info@structuredecuisine.ca'].forEach(href => {
                  const a=document.createElement('a');a.href=href;a.addEventListener('click',e=>e.preventDefault());document.body.append(a);a.click();a.remove();
                });
              }''')
              hits = page.evaluate('window.__gcHits')
              paths = [h['path'] for h in hits]
              for expected in ['profil-gestionnaire','profil-cuisinier','section-gestionnaire-foodcost','section-cuisinier-mapaq','contact-sdc-telephone','contact-sdc-courriel']:
                  assert expected in paths, (expected, paths)
              assert sum(not h.get('event') for h in hits) == 1
              assert 'must-not-leak' not in json.dumps(hits)
              assert len(paths) == len(set(paths))
              print('MOCKED_BROWSER_TESTS_PASSED', json.dumps(paths))
              script = page.request.get('https://gc.zgo.at/count.js')
              assert script.ok, script.status
              test = browser.new_page()
              test.route('**/*', lambda r: r.fulfill(body='<html><body>SDC technical check</body></html>', content_type='text/html'))
              test.goto('https://coriandre.structuredecuisine.ca/')
              test.evaluate('''() => { window.goatcounter={no_onload:true,endpoint:'https://os-coriandre.goatcounter.com/count'}; }''')
              test.add_script_tag(content=script.text())
              url = test.evaluate('''() => window.goatcounter.url({path:'controle-technique-installation',title:'Controle technique SDC - pas un prospect',event:true,referrer:'verification-technique-sdc'})''')
              assert url.startswith(endpoint + '?'), url
              result = page.request.get(url)
              print('TECHNICAL_COUNT_HTTP_STATUS', result.status)
              print('TECHNICAL_EVENT', 'controle-technique-installation')
              assert result.ok, result.status
              browser.close()
      - name: Commit only tested index on the isolated branch
        run: |
          git config user.name 'SDC integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'feat: connect Coriandre GoatCounter visits profiles modules and SDC contact clicks'
          git push origin HEAD:refs/heads/sdc/goatcounter-coriandre-20260922
      - name: Verify live page after reviewed merge and Pages deployment
        shell: python
        run: |
          import time, json
          from urllib.request import Request, urlopen
          from playwright.sync_api import sync_playwright
          url = 'https://coriandre.structuredecuisine.ca/?sdc_build=goatcounter_20260922'
          for attempt in range(48):
              try:
                  request = Request(url, headers={'Cache-Control':'no-cache'})
                  with urlopen(request, timeout=15) as response:
                      live = response.read().decode('utf-8')
                  if 'id="sdc-goatcounter-events"' in live and 'https://os-coriandre.goatcounter.com/count' in live:
                      print('LIVE_HTML_TRACKER_CONFIRMED', flush=True)
                      break
              except Exception as error:
                  print('LIVE_WAIT', type(error).__name__, flush=True)
              time.sleep(10)
          else:
              raise SystemExit('Live publication not yet confirmed; no claim of deployment success.')
          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              page = browser.new_page()
              responses = []
              page.on('response', lambda r: responses.append({'status':r.status}) if r.url.startswith('https://os-coriandre.goatcounter.com/count?') else None)
              page.route('**/*', lambda r: r.abort() if r.request.resource_type in ['image','font','media'] and not r.request.url.startswith('https://os-coriandre.goatcounter.com/count?') else r.continue_())
              page.goto('https://coriandre.structuredecuisine.ca/?utm_campaign=controle_installation&utm_source=test_technique', wait_until='domcontentloaded')
              page.wait_for_function('!!(window.goatcounter && window.goatcounter.count && window.sdcFlushAnalytics)')
              page.wait_for_timeout(3000)
              info = page.evaluate('''() => ({endpoint:window.goatcounter.endpoint, filter:window.goatcounter.filter(), integrated:!!window.__sdcCoriandreAnalytics})''')
              print('LIVE_BROWSER_STATE', json.dumps(info), flush=True)
              print('LIVE_BROWSER_COUNT_RESPONSES', json.dumps(responses), flush=True)
              assert info['integrated']
              assert info['endpoint'] == 'https://os-coriandre.goatcounter.com/count'
              browser.close()
